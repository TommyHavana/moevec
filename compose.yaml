services:
  secrets-init:
    build:
      context: .
      dockerfile: deploy/secrets.Dockerfile
    volumes:
      - secret-files:/run/mee-secrets
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      wordpress-init:
        condition: service_completed_successfully
    restart: unless-stopped

  wordpress:
    build:
      context: .
      dockerfile: deploy/wordpress.Dockerfile
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: mee_wordpress
      WORDPRESS_DB_USER: mee_wordpress
      WORDPRESS_DB_PASSWORD_FILE: /run/mee-secrets/database_password
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://moevec.org/blog');
        define('WP_SITEURL', 'https://moevec.org/blog');
        define('FORCE_SSL_ADMIN', true);
        define('DISALLOW_FILE_EDIT', true);
        define('DISABLE_WP_CRON', true);
    volumes:
      - wordpress-files:/var/www/html
      - secret-files:/run/mee-secrets:ro
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  wordpress-init:
    user: "33:33"
    build:
      context: .
      dockerfile: deploy/wordpress-cli.Dockerfile
    entrypoint: ["/bin/sh"]
    command: ["/opt/mee/install-wordpress.sh"]
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: mee_wordpress
      WORDPRESS_DB_USER: mee_wordpress
      WORDPRESS_DB_PASSWORD_FILE: /run/mee-secrets/database_password
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://moevec.org/blog');
        define('WP_SITEURL', 'https://moevec.org/blog');
        define('FORCE_SSL_ADMIN', true);
        define('DISALLOW_FILE_EDIT', true);
        define('DISABLE_WP_CRON', true);
    volumes:
      - wordpress-files:/var/www/html
      - secret-files:/run/mee-secrets:ro
    depends_on:
      wordpress:
        condition: service_started
      database:
        condition: service_healthy
    restart: "no"

  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: mee_wordpress
      MARIADB_USER: mee_wordpress
      MARIADB_PASSWORD_FILE: /run/mee-secrets/database_password
      MARIADB_ROOT_PASSWORD_FILE: /run/mee-secrets/root_password
    volumes:
      - database-files:/var/lib/mysql
      - secret-files:/run/mee-secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  secret-files:
  wordpress-files:
  database-files:
