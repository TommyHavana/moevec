proxy_cache_path /var/cache/nginx/mee levels=1:2 keys_zone=mee_blog:10m max_size=100m inactive=15m use_temp_path=off;
map $http_x_forwarded_proto $mee_proto { default $scheme; https https; }
map $http_cookie $mee_private { default 0; ~*wordpress_logged_in|wordpress_sec|wp-postpass|comment_author 1; }
map $request_method $mee_write { default 1; GET 0; HEAD 0; }
map $request_uri $mee_dynamic { default 0; ~*wp-admin|wp-login|wp-json|wp-cron|xmlrpc|preview=true|\? 1; }
map "$mee_private$mee_write$mee_dynamic" $mee_skip_cache { default 1; "000" 0; }
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Only the internal Coolify proxy can reach this container (no public host port).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    if ($host = www.moevec.org) { return 301 https://moevec.org$request_uri; }
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://secure.gravatar.com; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;
    location ~ /\. { deny all; }
    location ~* ^/blog/wp-content/uploads/.*\.php$ { return 404; }
    location ~* ^/blog/(xmlrpc\.php|readme\.html|license\.txt|wp-content/debug\.log|wp-config\.php.*)$ { return 404; }
    location ~* \.(?:bak|sql|env|log)$ { return 404; }
    location = /blog { return 301 /blog/; }
    location ^~ /_next/static/ { expires 1y; try_files $uri =404; }
    location ~* ^/(?:images|fonts|brand)/.*\.(?:webp|woff2)$ { expires 30d; try_files $uri =404; }
    location /blog/ {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mee_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Powered-By;
        proxy_redirect off;
        proxy_cache mee_blog;
        proxy_cache_bypass $mee_skip_cache;
        proxy_no_cache $mee_skip_cache $upstream_http_set_cookie;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        client_max_body_size 32m;
    }
    location = /404.html { internal; }
    error_page 404 /404.html;
    location / { expires -1; try_files $uri $uri/ =404; }
}
